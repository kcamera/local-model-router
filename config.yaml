# Local Model Router — routing configuration.
# Edit this file to add tools, change routing rules, or point at a different
# llama-server. Changes are picked up without restarting the router.
#
# Every routing rule has a `reason` field. Reasons are written to the log
# with every dispatch decision so the empirical record is auditable.

defaults:
  backend: decline
  reason: "Safe default: unknown tools are declined back to Claude Code"

backends:
  local:
    base_url: "http://localhost:8080"
    timeout_seconds: 120

# Hard overrides evaluated in order, first match wins. Each match block can
# specify `tool` (glob) and/or `decline_above_tokens` (matches when input
# exceeds the threshold). Use these for global rules like "no local inference
# above N tokens regardless of tool".
overrides:
  - match:
      tool: "*"
      decline_above_tokens: 6000
    decline: true
    reason: "Inputs above 6k tokens reliably degrade across local models; route to Claude Code"

tools:
  summarize:
    description: "Summarize the given text into a shorter form."
    task_type: summarization
    parameters:
      text:
        type: string
        description: "The text to summarize"
        required: true
      max_length:
        type: string
        description: "Target length: short, medium, or long"
        default: medium
    system_prompt: |
      You are a precise summarizer. Summarize the following text.
      Target length: {max_length} (short = 1-2 sentences, medium = 1 paragraph, long = 2-3 paragraphs).
      Do not add commentary; produce only the summary.
    user_prompt: "{text}"
    routing:
      backend: local
      reason: "Summarization is extractive; local model handles well within size limits"
      decline_above_tokens: 4000
      decline_reason: "Summarization quality drops on local model above 4k input tokens"
      max_tokens: 512
      temperature: 0.0

  extract:
    description: "Extract structured data from text according to a schema description. Returns JSON."
    task_type: extraction
    parameters:
      text:
        type: string
        description: "The source text to extract from"
        required: true
      schema:
        type: string
        description: "Description of what to extract (e.g., 'names, dates, dollar amounts')"
        required: true
    system_prompt: |
      You extract structured information from text. Return ONLY a JSON object
      containing the requested fields. No prose, no commentary, no markdown
      fences. If a field is not present in the text, use null.

      Fields to extract: {schema}
    user_prompt: "{text}"
    routing:
      backend: local
      reason: "Constrained-output extraction is a local-model strength"
      decline_above_tokens: 3000
      decline_reason: "Extraction reliability drops above 3k tokens; let Claude Code handle long documents"
      max_tokens: 1024
      temperature: 0.0

  classify:
    description: "Classify text into one of a fixed set of categories."
    task_type: classification
    parameters:
      text:
        type: string
        description: "The text to classify"
        required: true
      categories:
        type: string
        description: "Comma-separated list of valid categories"
        required: true
    system_prompt: |
      Choose exactly one category from the list that best fits the text.
      Reply with ONLY the chosen category — no explanation, no punctuation,
      no quotes.

      Categories: {categories}
    user_prompt: "{text}"
    routing:
      backend: local
      reason: "Classification has a constrained output space; small models are very reliable here"
      decline_above_tokens: 2000
      decline_reason: "Long inputs degrade classification accuracy; route long classifications to Claude Code"
      max_tokens: 32
      temperature: 0.0

  rewrite:
    description: "Rewrite text in a target style."
    task_type: rewriting
    parameters:
      text: { type: string, required: true }
      style: { type: string, required: true }
    system_prompt: "Rewrite the text in the {style} style. Output only the rewrite."
    user_prompt: "{text}"
    routing:
      backend: local
      reason: "Style rewrites are generative but constrained"
      decline_above_tokens: 2000
      max_tokens: 1024
